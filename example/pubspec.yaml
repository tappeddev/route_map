name: example
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  route_map:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  tapped_lints:
    git:
      url: https://github.com/tappeddev/tapped_lints.git
      ref: master

dependency_overrides:
  maplibre_gl:
    git:
      url: https://github.com/maplibre/flutter-maplibre-gl
      ref: release-0.26.2
      path: maplibre_gl
  maplibre_gl_web:
    git:
      url: https://github.com/maplibre/flutter-maplibre-gl
      ref: release-0.26.2
      path: maplibre_gl_web
  maplibre_gl_platform_interface:
    git:
      url: https://github.com/maplibre/flutter-maplibre-gl
      ref: release-0.26.2
      path: maplibre_gl_platform_interface


flutter:
  uses-material-design: true

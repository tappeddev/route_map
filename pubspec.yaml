name: route_map
description: "A Flutter map widget built on MapLibre for drawing routes, themed markers, geographic areas, clustered POIs and coverage overlays."
version: 0.1.0
repository: https://github.com/tappeddev/route_map
issue_tracker: https://github.com/tappeddev/route_map/issues

environment:
  sdk: ^3.8.0
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0
  freezed_annotation: ^3.1.0
  collection: ^1.19.1
  maplibre_gl: ^0.27.1
  synchronized: ^3.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  tapped_lints:
    git:
      url: https://github.com/tappeddev/tapped_lints.git
      ref: master
  build_runner: ^2.15.0
  freezed: ^3.2.5

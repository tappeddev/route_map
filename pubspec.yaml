name: route_map
description: "A new Flutter project."
version: 0.0.1

environment:
  sdk: ^3.8.0
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0
  freezed_annotation: ^3.1.0
  collection: ^1.19.1
  synchronized: ^3.4.0
  maplibre_gl:
    git:
      url: https://github.com/maplibre/flutter-maplibre-gl.git
      ref: feature/840-manual-location-display
      path: maplibre_gl

# The manual location display feature lives in maplibre PR #885. The PR modifies
# maplibre_gl_platform_interface without bumping its version, so we override all
# interdependent monorepo packages to the same git ref to pull in the changes.
# See: https://github.com/maplibre/flutter-maplibre-gl/pull/885
dependency_overrides:
  maplibre_gl:
    git:
      url: https://github.com/maplibre/flutter-maplibre-gl.git
      ref: feature/840-manual-location-display
      path: maplibre_gl
  maplibre_gl_platform_interface:
    git:
      url: https://github.com/maplibre/flutter-maplibre-gl.git
      ref: feature/840-manual-location-display
      path: maplibre_gl_platform_interface
  maplibre_gl_web:
    git:
      url: https://github.com/maplibre/flutter-maplibre-gl.git
      ref: feature/840-manual-location-display
      path: maplibre_gl_web

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  tapped_lints:
    git:
      url: https://github.com/tappeddev/tapped_lints.git
      ref: master
  build_runner: ^2.15.0
  freezed: ^3.2.5
